name: Build APK

on:
  push:
    branches:
      - "claude/wifi-signal-analyzer-apk-**"
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias wifisurvey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=WiFi Survey, OU=Build, O=WiFi Survey, L=, ST=, C=GB"
        env:
          KEYSTORE_PASSWORD: wifisurvey

      - name: Build debug and release APKs
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: wifisurvey
          SIGNING_KEY_ALIAS: wifisurvey
          SIGNING_KEY_PASSWORD: wifisurvey
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/wifi-survey-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/wifi-survey-debug.apk
          ls -lh dist
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-survey-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collect.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/wifi-survey-release.apk \
            dist/wifi-survey-debug.apk \
            --title "WiFi Survey $TAG" \
            --notes "Android Wi-Fi analyser with top-down room heatmap mapping.

          **Install \`wifi-survey-release.apk\`** — download it on the phone and open it.
          Android will ask you to allow installing from this source; that is expected for
          any APK not from the Play Store.

          Built from commit \`${{ github.sha }}\`.

          Note: the debug build installs alongside the release build under a separate
          package id, so you can keep both." \
            --target "${{ github.sha }}"
